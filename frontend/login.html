<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diabetes RAG Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-shell">
    <section class="auth-card" aria-label="Login">
        <div class="auth-intro">
            <p class="eyebrow">Welcome back</p>
            <h1>Diabetes Care Chat</h1>
            <p>Continue tracking glucose, meals, sleep, hydration, activity, and symptoms with safe lifestyle guidance.</p>

            <div class="auth-highlights" aria-label="App highlights">
                <span>Glucose trends</span>
                <span>Lifestyle context</span>
                <span>Safety guardrails</span>
            </div>
        </div>

        <form class="auth-form" onsubmit="event.preventDefault(); loginUser();">
            <div class="auth-form-header">
                <h2>Sign in</h2>
                <p>Access your assistant and dashboard.</p>
            </div>

            <label>
                <span>Email</span>
                <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
            </label>

            <label>
                <span>Password</span>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            </label>

            <button type="submit">Login</button>

            <p id="authMessage" aria-live="polite"></p>

            <p class="auth-switch">New user? <a href="register.html">Create an account</a></p>
        </form>
    </section>
</main>

<script src="js/auth.js"></script>
</body>
</html>
